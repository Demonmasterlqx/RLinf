defaults:
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Actor ranks 0-6 map to physical GPUs 0,1,3,4,5,6,7.
    actor: 0-1,3-7

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:TABERO_FIRM_20K_RUN_DIR}
    project_name: tabero-rlinf
    experiment_name: ${oc.env:TABERO_FIRM_20K_RUN_NAME}
    logger_backends: [tensorboard, wandb]
  checkpoint_root: ${oc.env:TABERO_FIRM_20K_CHECKPOINT_ROOT}
  resume_dir: null
  max_epochs: -1
  max_steps: 20000
  val_check_interval: -1
  save_interval: 5000

data:
  train_data_paths:
    - dataset_path: /data/home/sim6g/code/tabero/datas/tabero_firm
      weight: 1.0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  # Seven ranks x micro-batch 1 x gradient accumulation 4.
  global_batch_size: 28
  seed: 0

  model:
    model_type: openpi
    model_path: /data/home/sim6g/code/tabero/models/pi0_base
    # FP32 parameters/optimizer; CUDA autocast executes eligible operators in BF16.
    precision: fp32
    is_lora: true
    lora_rank: 32
    paligemma_lora_rank: 16
    action_expert_lora_rank: 32
    lora_path: null
    lora_target: both
    freeze_non_lora: false
    extra_trainable_modules: [tactile_prefix_encoder]
    checkpoint_load_allowed_missing_prefixes: [tactile_prefix_encoder.]
    export_reference_model_path: /data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors
    export_norm_asset_id: NathanWu7/tabero_object_25
    num_action_chunks: 50
    action_dim: 13
    add_value_head: false
    num_steps: 10

    openpi_data:
      norm_stats_path: ${oc.env:TABERO_FIRM_NORM_STATS}

    openpi:
      config_name: pi0_lora_tacfield_tabero
      num_images_in_input: 2
      train_expert_only: false
      action_chunk: 50
      action_env_dim: 13
      effective_action_dim: 13
      tactile_dim: 6
      num_steps: 10
      tactile_loss_weight: 0.01
      padding_loss_weight: 1.0
      expert_his_c_fut_loss_mode: weighted_full

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 20000
    lr_warmup_steps: 1000
    lr_decay_steps: 30000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: false
    cpu_offload: false
    gradient_checkpointing: false
    save_full_model_weights: false
    save_trainable_model_weights: true
    checkpoint_format: dcp
    trainable_checkpoint_metadata:
      method: sft_full_lora_tacfield
      dataset: datas/tabero_firm
      training_precision: fp32
      compute_precision: bf16_amp
      export_precision: bf16
      paligemma_lora_rank: 16
      action_expert_lora_rank: 32
      freeze_non_lora: false
      tactile_tcn_initialization: random
      training_config: tabero_firm_sft_dual_rank_t2_precision_20k
      target_global_step: 20000
    mixed_precision:
      # Keep preprocessing inputs and reductions in FP32. Direct FSDP BF16 input
      # casting is incompatible with OpenPI's FP32 grid_sample augmentation grid.
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: fp32
    amp_autocast:
      enabled: true
      precision: bf16
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
