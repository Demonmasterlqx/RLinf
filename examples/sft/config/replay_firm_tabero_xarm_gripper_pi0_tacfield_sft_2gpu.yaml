defaults:
  - model/pi0@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:REPLAY_FIRM_XARM_PI0_RUN_DIR}
    project_name: tabero-rlinf
    experiment_name: ${oc.env:REPLAY_FIRM_XARM_PI0_RUN_NAME}
    logger_backends: [tensorboard, wandb]
  checkpoint_root: ${oc.env:REPLAY_FIRM_XARM_PI0_CHECKPOINT_ROOT}
  resume_dir: null
  max_epochs: -1
  max_steps: 5000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths:
    - dataset_path: /data/home/sim6g/code/tabero/datas/replay_firm_tabero_xarm_gripper
      weight: 1.0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 32
  seed: 0

  model:
    model_type: openpi
    model_path: /data/home/sim6g/code/tabero/models/pi0_base
    precision: fp32
    frozen_parameter_precision: bf16
    trainable_parameter_precision: fp32
    is_lora: true
    lora_rank: 32
    paligemma_lora_rank: 16
    action_expert_lora_rank: 32
    paligemma_lora_exclude_modules: ".*vision_tower.*"
    lora_path: null
    lora_target: both
    freeze_non_lora: true
    extra_trainable_modules:
      - paligemma_with_expert.paligemma.base_model.model.model.vision_tower
      - state_proj
      - action_in_proj
      - action_time_mlp_in
      - action_time_mlp_out
      - action_out_proj
      - tactile_prefix_encoder
    checkpoint_load_allowed_missing_prefixes: [tactile_prefix_encoder.]
    export_norm_asset_id: replay_firm_tabero_xarm_gripper
    num_action_chunks: 50
    action_dim: 13
    add_value_head: false
    num_steps: 10

    openpi_data:
      norm_stats_path: ${oc.env:REPLAY_FIRM_XARM_PI0_NORM_STATS}

    openpi:
      config_name: pi0_lora_tacfield_tabero_xarm_gripper
      pi05: false
      action_horizon: 50
      discrete_state_input: false
      num_images_in_input: 2
      train_expert_only: false
      action_chunk: 50
      action_env_dim: 13
      effective_action_dim: 13
      tactile_type: expert_his_c_fut
      tactile_dim: 6
      tactile_dim_in: 0
      tactile_prefix_dim_in: 7920
      tactile_prefix_history: 8
      tactile_prefix_encoder_type: tcn
      tactile_prefix_use_reference_frame: true
      tactile_prefix_diff_from_reference: false
      tactile_streams: [tactile_prefix]
      tactile_loss_weight: 0.01
      padding_loss_weight: 1.0
      expert_his_c_fut_loss_mode: weighted_full
      num_steps: 10

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 5000
    lr_warmup_steps: 1000
    lr_decay_steps: 30000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: false
    cpu_offload: false
    gradient_checkpointing: true
    limit_all_gathers: true
    save_full_model_weights: false
    save_trainable_model_weights: true
    checkpoint_format: dcp
    trainable_checkpoint_metadata:
      method: sft_full_lora_tacfield
      dataset: datas/replay_firm_tabero_xarm_gripper
      model_family: pi0
      openpi_config_name: pi0_lora_tacfield_tabero_xarm_gripper
      deployment_config_name: pi0_lora_tacfield_tabero_xarm_gripper
      action_horizon: 50
      effective_action_dim: 13
      tactile_prefix_dim_in: 7920
      tactile_prefix_history: 8
      gripper_coordinate: xarm_positive_open
      control_hz: 20
      policy_horizon_seconds: 2.5
      execution_steps: 10
      execution_horizon_seconds: 0.5
      frozen_parameter_precision: bf16
      trainable_parameter_precision: fp32
      compute_precision: bf16_amp
      export_precision: bf16
      paligemma_lora_rank: 16
      action_expert_lora_rank: 32
      freeze_non_lora: true
      trainable_siglip: true
      siglip_lora: false
      tactile_tcn_initialization: random
      training_config: replay_firm_tabero_xarm_gripper_pi0_tacfield_sft_2gpu
      target_global_step: 5000
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: bf16
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
