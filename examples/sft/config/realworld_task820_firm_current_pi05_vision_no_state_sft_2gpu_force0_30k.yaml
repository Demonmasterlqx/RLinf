# Reference: realworld_replay_task820_firm_gentle_mixed_current_pi05_tacfield_no_state_sft_2gpu_force005_30k.yaml
# Observation ablation: main/wrist RGB and language only; no measured force,
# marker-motion prefix, tactile RGB, or state tokens. EEF/gripper state is
# retained only for normalization and delta/absolute action conversion.
# Keep the 13D action interface and weighted_full padding loss unchanged;
# the six force-output dimensions receive zero direct loss weight.
# Set VTLA_WORKSPACE_ROOT to the workspace root in the selected runtime.
defaults:
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    # Same two-GPU topology; use free cards after GPU2 co-location caused OOM.
    actor: 4-5
runner:
  task_type: sft
  logger:
    log_path: ${oc.env:VTLA_WORKSPACE_ROOT}/results/pi05_vision_nostate_task820_firm_current_no_adverb_force0_lora_2gpu_30k
    project_name: tabero-rlinf
    experiment_name: pi05-vision-nostate-task820-firm-current-no-adverb-force0-lora-2gpu-30k
    logger_backends:
    - tensorboard
    - wandb
  checkpoint_root: ${oc.env:VTLA_WORKSPACE_ROOT}/results/pi05_vision_nostate_task820_firm_current_no_adverb_force0_lora_2gpu_30k/checkpoints
  resume_dir: null
  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000
data:
  train_data_paths:
  - dataset_path: ${oc.env:VTLA_WORKSPACE_ROOT}/datasets/xiangxin0923/realworld_task820_firm_current
    weight: 1.0
actor:
  group_name: Task820FirmCurrentNoAdverbForce0SftVision
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 32
  seed: 42
  model_weight_ema_decay: 0.99
  model:
    model_type: openpi
    model_path: ${oc.env:VTLA_WORKSPACE_ROOT}/models/pi05_base_pytorch
    precision: fp32
    frozen_parameter_precision: bf16
    trainable_parameter_precision: fp32
    is_lora: true
    lora_rank: 32
    paligemma_lora_rank: 16
    action_expert_lora_rank: 32
    paligemma_lora_exclude_modules: .*vision_tower.*
    lora_path: null
    lora_target: both
    freeze_non_lora: true
    extra_trainable_modules:
    - paligemma_with_expert.paligemma.base_model.model.model.vision_tower
    - action_in_proj
    - time_mlp_in
    - time_mlp_out
    - action_out_proj
    # No randomly initialized tactile encoder is needed for vision-only.
    checkpoint_load_allowed_missing_prefixes: []
    export_norm_asset_id: pi05_horizon50_vision_task820_firm_current
    num_action_chunks: 50
    action_dim: 13
    add_value_head: false
    num_steps: 10
    openpi_data:
      # Reuse this dataset's identical state/action statistics. The unused
      # tactile_prefix statistics do not create a tactile observation stream.
      norm_stats_path: ${oc.env:VTLA_WORKSPACE_ROOT}/datasets/xiangxin0923/realworld_task820_firm_current/meta/openpi_norm_stats/pi05_horizon50_tacfield_task820_firm_current/norm_stats.json
    openpi:
      config_name: pi05_lora_vision_realworld_replayed_task820
      pi05: true
      action_horizon: 50
      discrete_state_input: false
      num_images_in_input: 2
      train_expert_only: false
      action_chunk: 50
      action_env_dim: 13
      effective_action_dim: 13
      # This type splits the loss into 7 controls + 6 force outputs;
      # it does not enable a force observation when both input dims are zero.
      tactile_type: expert_his_c_fut
      tactile_dim: 6
      tactile_dim_in: 0
      tactile_history: null
      tactile_prefix_dim_in: 0
      tactile_prefix_history: null
      tactile_prefix_encoder_type: null
      tactile_prefix_use_reference_frame: null
      tactile_prefix_diff_from_reference: null
      tactile_streams: []
      tactile_loss_weight: 0.0
      padding_loss_weight: 1.0
      expert_his_c_fut_loss_mode: weighted_full
      num_steps: 10
  optim:
    lr: 2.5e-05
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 10000
    lr_decay_steps: 1000000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-06
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    cpu_offload: false
    gradient_checkpointing: true
    limit_all_gathers: true
    save_full_model_weights: false
    save_trainable_model_weights: true
    checkpoint_format: dcp
    trainable_checkpoint_metadata:
      # The current shared exporter needs explicit vision-method support before
      # these checkpoints can be exported; do not label them as TacField.
      method: sft_full_lora_vision
      dataset: datasets/xiangxin0923/realworld_task820_firm_current
      dataset_fps: 5
      model_family: pi05
      base_model: models/pi05_base_pytorch
      base_model_sha256: bf5d442a10c488298e3440a9ff3eead7d0e1e43335597588b00760693a39d621
      openpi_config_name: pi05_lora_vision_realworld_replayed_task820
      deployment_config_name: pi05_lora_vision_realworld_replayed_task820
      discrete_state_input: false
      action_horizon: 50
      execution_steps: 10
      # Deployment timing from the reference, not the dataset's recorded FPS.
      control_hz: 20
      policy_horizon_seconds: 2.5
      execution_horizon_seconds: 0.5
      effective_action_dim: 13
      tactile_input: none
      tactile_prefix_dim_in: 0
      tactile_prefix_history: null
      tactile_prefix_encoder_type: null
      tactile_prefix_use_reference_frame: null
      tactile_prefix_diff_from_reference: null
      tactile_streams: []
      num_images_in_input: 2
      excluded_tactile_inputs:
      - tactile_image
      - tactile_gripper_force
      - tactile_marker_motion
      action_loss_weight: 1.0
      future_force_loss_weight: 0.0
      padding_loss_weight: 1.0
      loss_mode: weighted_full
      gripper_coordinate: xarm_positive_open
      frozen_parameter_precision: bf16
      trainable_parameter_precision: fp32
      compute_precision: bf16_amp
      export_precision: bf16
      paligemma_lora_rank: 16
      action_expert_lora_rank: 32
      freeze_non_lora: true
      trainable_siglip: true
      siglip_lora: false
      tactile_tcn_initialization: none
      model_weight_ema_decay: 0.99
      weight_variant: ema
      training_config: realworld_task820_firm_current_pi05_vision_no_state_sft_2gpu_force0_30k
      target_global_step: 30000
      dataset_variant: firm_current_no_adverb
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: bf16
    grad_scaler:
      enabled: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
