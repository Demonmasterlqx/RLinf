defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: "0-4"

runner:
  task_type: sft
  logger:
    log_path: "/data/home/sim6g/code/tabero/results/tabero_rlt_stage1"
    project_name: "tabero-rlinf"
    experiment_name: "tabero_rlt_stage1_tacfield"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: -1
  max_steps: 2000
  val_check_interval: -1
  save_interval: 250

data:
  train_data_paths:
    - dataset_path: "/data/home/sim6g/code/tabero/datas/tabero"
      weight: 1.0

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 40
  seed: 0

  model:
    model_type: "openpi"
    model_path: "/data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors"
    # OpenPI preprocessing must receive FP32 images. The model internally keeps
    # its selected backbone and RLT parameters in BF16.
    precision: null
    is_lora: False
    num_action_chunks: 10
    action_dim: 13
    add_value_head: False
    num_steps: 10

    openpi_data:
      norm_stats_path: "/data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors/assets/NathanWu7/tabero/norm_stats.json"

    openpi:
      config_name: "pi0_lora_tacfield_tabero"
      num_images_in_input: 2
      train_expert_only: True
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      tactile_loss_weight: 0.0
      use_rlt: True
      rlt_train_module_only: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_num_rl_tokens: 1
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 2.5e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 200
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    cpu_offload: False
    gradient_checkpointing: False
    save_trainable_model_weights: True
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null

reward:
  use_reward_model: False

critic:
  use_critic_model: False
