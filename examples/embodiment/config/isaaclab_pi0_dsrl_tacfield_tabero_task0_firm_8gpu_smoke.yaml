hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false

cluster:
  num_nodes: 1
  component_placement:
    actor: "4-7"
    rollout: "0-3"
    env: "0-3"

runner:
  task_type: embodied
  logger:
    log_path: "/data/home/sim6g/code/tabero/results/tabero_task0_firm_tactile_dsrl_8gpu_smoke_${oc.env:TABERO_TASK0_DSRL_RUN_ID}"
    project_name: tabero-rlinf
    experiment_name: "tabero_task0_firm_tactile_dsrl_8gpu_smoke_${oc.env:TABERO_TASK0_DSRL_RUN_ID}"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 1
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: False
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: True
    cache_size: 1024
    sample_window_size: 1024
    min_buffer_size: 1
    auto_save: False
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    env_type: isaaclab
    rollout_epoch: 2
    total_num_envs: 84
    auto_reset: False
    ignore_terminations: False
    use_rel_reward: False
    use_step_penalty: False
    seed: 42
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: True
    max_steps_per_rollout_epoch: 360
    max_episode_steps: 360
    video_cfg:
      save_video: False
      info_on_video: True
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: "Isaac-Libero-Franka-Hybrid-Tactile-v0"
      num_envs: null
      max_episode_steps: ${..max_episode_steps}
      task_description: "pick up the alphabet soup and place it in the basket"
      extension_path: "/data/home/sim6g/code/tabero/Tabero/source/tac_manip"
      libero_config_dir: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/config"
      libero_assets_dir: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/USD"
      hdf5_initial_states_path: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/assembled_hdf5/libero_object_task0_pick_up_the_alphabet_soup_and_place_it_in_the_basket_demo.hdf5"
      hdf5_reset_assignment: cyclic
      task_suite: "libero_object"
      task_id: 0
      tasks:
        - task_suite: "libero_object"
          task_id: 0
      require_all_tasks_active: True
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        condition_reward_multipliers: null
      prompt_conditions:
        enabled: True
        assignment: cyclic
        condition_cycle: [firm]
        firm_adverbs: [firmly, tightly]
        gentle_adverbs: [gently, softly]
        prompt_seed: 0
      use_relative_mode: False
      marker_history_len: 8
      combined_marker_count: 198
      main_image_key: "agentview_rgb"
      wrist_image_key: "eye_in_hand_rgb"
      marker_motion_key: "gripper_marker_motion"
      force_key: null
      agentview_cam:
        height: 256
        width: 256
      eye_in_hand_cam:
        height: 256
        width: 256

  eval:
    env_type: isaaclab
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    use_rel_reward: False
    use_step_penalty: False
    seed: 42
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: True
    max_steps_per_rollout_epoch: 360
    max_episode_steps: 360
    video_cfg:
      save_video: False
      info_on_video: True
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: "Isaac-Libero-Franka-Hybrid-Tactile-v0"
      num_envs: null
      max_episode_steps: ${..max_episode_steps}
      task_description: "pick up the alphabet soup and place it in the basket"
      extension_path: "/data/home/sim6g/code/tabero/Tabero/source/tac_manip"
      libero_config_dir: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/config"
      libero_assets_dir: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/USD"
      hdf5_initial_states_path: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/assembled_hdf5/libero_object_task0_pick_up_the_alphabet_soup_and_place_it_in_the_basket_demo.hdf5"
      hdf5_reset_assignment: cyclic
      task_suite: "libero_object"
      task_id: 0
      tasks:
        - task_suite: "libero_object"
          task_id: 0
      require_all_tasks_active: True
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        condition_reward_multipliers: null
      prompt_conditions:
        enabled: False
      use_relative_mode: False
      marker_history_len: 8
      combined_marker_count: 198
      main_image_key: "agentview_rgb"
      wrist_image_key: "eye_in_hand_rgb"
      marker_motion_key: "gripper_marker_motion"
      force_key: null
      agentview_cam:
        height: 256
        width: 256
      eye_in_hand_cam:
        height: 256
        width: 256

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False
  model:
    model_path: "/data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 2
  global_batch_size: 168
  seed: 42
  enable_offload: False
  combine_reference_model: True
  model:
    model_path: "/data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors"
    model_type: "openpi"
    precision: null
    num_action_chunks: 10
    action_dim: 13
    is_lora: False
    use_proprio: True
    num_steps: 10
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    num_q_heads: 10
    openpi:
      config_name: "pi0_lora_tacfield_tabero"
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: True
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"
      add_value_head: ${actor.model.add_value_head}
      joint_logprob: False
      value_after_vlm: False
      value_vlm_mode: "mean_token"
      detach_critic_input: True
      tactile_loss_weight: 0.0
      use_dsrl: True
      dsrl_use_tactile: True
      dsrl_state_dim: 7
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: "mean"
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_tactile_latent_dim: 64
      dsrl_hidden_dims: [128, 128, 128]
  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-8
    clip_grad: 3.5
    weight_decay: 0.0
  critic_optim:
    lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    clip_grad: 10.0
    lr_scheduler: torch_constant
    weight_decay: 0.0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    cpu_offload: False
    offload_pin_memory: False
    reshard_after_forward: True
    enable_gradient_accumulation: True
    forward_prefetch: False
    limit_all_gathers: False
    backward_prefetch: null
    use_orig_params: True
    use_liger_kernel: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: False
      precision: "bf16"
    grad_scaler:
      enabled: False
    # DCP cannot serialize disjoint actor/critic optimizers with FSDP1
    # use_orig_params; local shards preserve both optimizer states.
    checkpoint_format: "local_shard"
    save_full_model_weights: False
    save_trainable_model_weights: True

reward:
  use_reward_model: False

critic:
  use_critic_model: False

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: True
    compression: none
    init_sync:
      enabled: True
      prefixes: null
      bucket_size: 134217728
