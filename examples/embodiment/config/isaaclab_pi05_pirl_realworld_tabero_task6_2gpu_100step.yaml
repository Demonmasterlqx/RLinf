defaults:
  - env/isaaclab_xarm_umi_gentle_grasp_task6@env.train
  - env/isaaclab_xarm_umi_gentle_grasp_task6@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: "1"
    rollout: "0"
    env: "0"

runner:
  task_type: embodied
  logger:
    log_path: /data/home/sim6g/code/tabero/results
    project_name: tabero-rlinf
    experiment_name: ${oc.env:REALWORLD_TABERO_PIRL_RUN_ID}
    logger_backends: [tensorboard, wandb]
  max_epochs: 100
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  tabero_ppo_transition_boundary_semantics: terminal_observation_first_done_prefix_logprob_default_reset_v1
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.05
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 2
    total_num_envs: 8
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:REALWORLD_TABERO_PI05_CHECKPOINT}
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 16
  seed: 42
  enable_offload: false
  combine_reference_model: true
  model:
    model_path: ${oc.env:REALWORLD_TABERO_PI05_CHECKPOINT}
    model_type: openpi
    precision: null
    frozen_parameter_precision: bf16
    trainable_parameter_precision: fp32
    num_action_chunks: 10
    action_dim: 13
    is_lora: true
    lora_rank: 32
    action_expert_lora_rank: 32
    lora_path: null
    lora_target: action_expert
    freeze_non_lora: true
    use_proprio: true
    num_steps: 10
    add_value_head: true
    checkpoint_load_allowed_missing_prefixes: [value_head.]
    tabero_pi05_checkpoint_contract:
      expected_model_sha256: ${oc.env:REALWORLD_TABERO_PI05_MODEL_SHA256}
      expected_norm_stats_sha256: ${oc.env:REALWORLD_TABERO_PI05_NORM_STATS_SHA256}
      expected_config_name: pi05_lora_tacfield_tabero_xarm_gripper
      expected_norm_asset_id: replay_firm_tabero_xarm_gripper
      expected_dataset: datas/replay_firm_tabero_xarm_gripper
      expected_gripper_coordinate: xarm_positive_open
      require_final: true
    openpi:
      config_name: pi05_lora_tacfield_tabero_xarm_gripper
      pi05: true
      action_horizon: 10
      discrete_state_input: true
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: 10
      num_steps: 10
      train_expert_only: true
      action_env_dim: 13
      effective_action_dim: 13
      noise_method: flow_sde
      add_value_head: true
      joint_logprob: false
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      tactile_type: expert_his_c_fut
      tactile_dim: 6
      tactile_dim_in: 0
      tactile_prefix_dim_in: 7920
      tactile_prefix_history: 8
      tactile_prefix_encoder_type: tcn
      tactile_prefix_use_reference_frame: true
      tactile_prefix_diff_from_reference: false
      tactile_streams: [tactile_prefix]
      tactile_loss_weight: 0.0
      use_dsrl: false
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: bf16
    grad_scaler:
      enabled: false
    checkpoint_format: dcp
    save_full_model_weights: false
    save_trainable_model_weights: true
    trainable_checkpoint_metadata:
      method: pirl
      task_domain: realworld
      task_suite: gentle_grasp
      task_id: 6
      target_object: target_object_1
      task_description: "pick up the Vitasoy and put it into the basket"
      control_mode: hybrid_tactile
      reset_source: task_config_default_reset
      policy_gripper_sign_bridge: false
      gripper_coordinate: xarm_positive_open
      action_filter: xarm_sim_action_chunk_filter_v1
      camera_preprocess: stretch_480x640_to_224x224_inter_area
      model_family: pi05
      openpi_config_name: pi05_lora_tacfield_tabero_xarm_gripper
      dataset: datas/replay_firm_tabero_xarm_gripper
      normalization_asset_id: replay_firm_tabero_xarm_gripper
      base_model_sha256: ${actor.model.tabero_pi05_checkpoint_contract.expected_model_sha256}
      base_norm_stats_sha256: ${actor.model.tabero_pi05_checkpoint_contract.expected_norm_stats_sha256}
      base_checkpoint_require_final: ${actor.model.tabero_pi05_checkpoint_contract.require_final}
      action_horizon: 10
      effective_action_dim: 13
      state_dim: 7
      camera_count: 2
      tactile_prefix_dim_in: 7920
      tactile_prefix_history: 8
      combined_marker_count: 440
      training_config: isaaclab_pi05_pirl_realworld_tabero_task6_2gpu_100step
      target_global_step: 100
      tabero_ppo_transition_boundary_semantics: terminal_observation_first_done_prefix_logprob_default_reset_v1

reward:
  use_reward_model: false

critic:
  use_critic_model: false
