hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false

cluster:
  num_nodes: 1
  component_placement:
    actor: 3
    rollout: "0-1"
    env: "0-1"

runner:
  task_type: embodied
  logger:
    log_path: "/data/home/sim6g/code/tabero/results/tabero_task5_firm_long_4env_smoke_20260716"
    project_name: tabero-rlinf
    experiment_name: "tabero_task5_firm_long_4env_smoke"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 1
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.05
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    env_type: isaaclab
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: False
    ignore_terminations: False
    use_rel_reward: False
    seed: 42
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: True
    max_steps_per_rollout_epoch: 20
    max_episode_steps: 20
    video_cfg:
      save_video: False
      info_on_video: True
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: "Isaac-Libero-Franka-Hybrid-Tactile-v0"
      num_envs: null
      max_episode_steps: ${..max_episode_steps}
      task_description: "pick up the tomato sauce and place it in the basket"
      extension_path: "/data/home/sim6g/code/tabero/Tabero/source/tac_manip"
      libero_config_dir: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/config"
      libero_assets_dir: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/USD"
      hdf5_initial_states_path: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/assembled_hdf5/libero_object_task5_pick_up_the_tomato_sauce_and_place_it_in_the_basket_demo.hdf5"
      hdf5_reset_assignment: cyclic
      task_suite: "libero_object"
      task_id: 5
      tasks:
        - task_suite: "libero_object"
          task_id: 5
      require_all_tasks_active: True
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        condition_reward_multipliers: null
      prompt_conditions:
        enabled: True
        assignment: cyclic
        condition_cycle: [firm]
        firm_adverbs: [firmly, tightly]
        gentle_adverbs: [gently, softly]
        prompt_seed: 0
      use_relative_mode: False
      marker_history_len: 8
      combined_marker_count: 198
      main_image_key: "agentview_rgb"
      wrist_image_key: "eye_in_hand_rgb"
      marker_motion_key: "gripper_marker_motion"
      force_key: null
      agentview_cam:
        height: 256
        width: 256
      eye_in_hand_cam:
        height: 256
        width: 256

  eval:
    env_type: isaaclab
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    use_rel_reward: False
    seed: 42
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: True
    max_steps_per_rollout_epoch: 20
    max_episode_steps: 20
    video_cfg:
      save_video: False
      info_on_video: True
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: "Isaac-Libero-Franka-Hybrid-Tactile-v0"
      num_envs: null
      max_episode_steps: ${..max_episode_steps}
      task_description: "pick up the tomato sauce and place it in the basket"
      extension_path: "/data/home/sim6g/code/tabero/Tabero/source/tac_manip"
      libero_config_dir: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/config"
      libero_assets_dir: "/data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/USD"
      task_suite: "libero_object"
      task_id: 5
      tasks:
        - task_suite: "libero_object"
          task_id: 5
      require_all_tasks_active: True
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        condition_reward_multipliers: null
      prompt_conditions:
        enabled: False
      use_relative_mode: False
      marker_history_len: 8
      combined_marker_count: 198
      main_image_key: "agentview_rgb"
      wrist_image_key: "eye_in_hand_rgb"
      marker_motion_key: "gripper_marker_motion"
      force_key: null
      agentview_cam:
        height: 256
        width: 256
      eye_in_hand_cam:
        height: 256
        width: 256

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "/data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 4
  seed: 42
  enable_offload: True
  combine_reference_model: True
  model:
    model_path: "/data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors"
    model_type: "openpi"
    precision: null
    num_action_chunks: 10
    action_dim: 13
    is_lora: True
    lora_rank: 32
    lora_path: null
    lora_target: "both"
    freeze_non_lora: True
    use_proprio: True
    num_steps: 10
    add_value_head: True
    openpi:
      config_name: "pi0_lora_tacfield_tabero"
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: ${actor.model.num_action_chunks}
      num_steps: ${actor.model.num_steps}
      train_expert_only: True
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"
      add_value_head: ${actor.model.add_value_head}
      joint_logprob: False
      value_after_vlm: False
      value_vlm_mode: "mean_token"
      detach_critic_input: True
      tactile_loss_weight: 0.0
      use_dsrl: False
      dsrl_state_dim: 8
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: "mean"
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_hidden_dims: [128, 128, 128]
  optim:
    lr: 1.0e-7
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: False
    cpu_offload: False
    offload_pin_memory: False
    reshard_after_forward: True
    enable_gradient_accumulation: True
    forward_prefetch: False
    limit_all_gathers: False
    backward_prefetch: null
    use_orig_params: False
    use_liger_kernel: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: False
      precision: "bf16"
    grad_scaler:
      enabled: False
    checkpoint_format: "none"
    save_full_model_weights: False
    save_trainable_model_weights: True

reward:
  use_reward_model: False

critic:
  use_critic_model: False

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: True
    compression: none
    init_sync:
      enabled: True
      prefixes: null
      bucket_size: 134217728
