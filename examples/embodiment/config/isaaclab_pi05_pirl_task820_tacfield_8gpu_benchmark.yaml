# Best throughput among the short screening runs recorded on 2026-09-07.
# Training pipeline overlaps actor updates with the second rollout epoch.
# Each env GPU hosts two independent Isaac processes, eight envs per process.
# Keep gradient checkpointing disabled: Gemma training cache must match rollout.
# Tested with NCCL_SHM_DISABLE=1 NCCL_P2P_DISABLE=1 NCCL_SOCKET_IFNAME=lo
# exported before launch to avoid this host's NCCL shared-memory failures.
# Screening measured one complete runner iteration per configuration;
# this preset does not establish steady-state throughput or training quality.
defaults:
- env/isaaclab_xarm_umi_gentle_grasp_task6@env.train
- env/isaaclab_xarm_umi_gentle_grasp_task6@env.eval
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    env: 0-5
    rollout: 6
    actor: 7
runner:
  task_type: embodied
  logger:
    log_path: /data/home/chenxiangyu/Tabero/results/task820_step18000_pirl_8gpu_n96_m16_s2
    project_name: tabero-rlinf
    experiment_name: task820_step18000_pirl_8gpu_n96_m16_s2
    logger_backends:
    - tensorboard
    - wandb
    wandb_entity: 183842220-hkust
  max_epochs: 3
  max_steps: 3
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  use_training_pipeline: true
  overlap_env_bootstrap: true
  weight_sync_interval: 1
algorithm:
  tabero_ppo_transition_boundary_semantics: terminal_observation_first_done_prefix_logprob_default_reset_gripper_map_v2
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.05
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 2
    total_num_envs: 96
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/train
      image_keys:
      - main_images
      - wrist_images
      image_names:
      - agentview
      - eye_in_hand
      composite_views:
      - agentview
      - eye_in_hand
      composite_name: combined
    init_params:
      extension_path: /data/home/chenxiangyu/Tabero/Tabero_X/source/tac_manip
      realworld_config_dir: /data/home/chenxiangyu/Tabero/Tabero_X/benchmarks/datasets/realworld/config
      realworld_assets_dir: /data/home/chenxiangyu/Tabero/Tabero_X/benchmarks/datasets/realworld/USD
      gripper_diagnostics_path: ''
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
  eval:
    rollout_epoch: 2
    total_num_envs: 96
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval
      image_keys:
      - main_images
      - wrist_images
      image_names:
      - agentview
      - eye_in_hand
      composite_views:
      - agentview
      - eye_in_hand
      composite_name: combined
    init_params:
      extension_path: /data/home/chenxiangyu/Tabero/Tabero_X/source/tac_manip
      realworld_config_dir: /data/home/chenxiangyu/Tabero/Tabero_X/benchmarks/datasets/realworld/config
      realworld_assets_dir: /data/home/chenxiangyu/Tabero/Tabero_X/benchmarks/datasets/realworld/USD
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
rollout:
