# Connectivity smoke: two runner iterations, one SAC update per iteration.
# Frozen step-18000 PI0.5 TacField backbone; train DSRL steering and Q heads.
# Use legacy trajectory replay/full trainable sync for the 440-marker input.
# SAC does not support runner.use_training_pipeline; gradient checkpointing is off.
# This host needs NCCL_SHM_DISABLE=1 NCCL_P2P_DISABLE=1 NCCL_SOCKET_IFNAME=lo.
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    env: 0-3
    rollout: 4-5
    actor: 6-7
runner:
  task_type: embodied
  logger:
    log_path: /data/home/chenxiangyu/Tabero/results/2026-09-07-task820-dsrl-smoke/task820_step18000_dsrl_smoke_8gpu_n8_m2
    project_name: tabero-rlinf
    experiment_name: task820_step18000_dsrl_smoke_8gpu_n8_m2
    logger_backends:
    - tensorboard
    - wandb
    wandb_entity: 183842220-hkust
  max_epochs: 2
  max_steps: 2
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  use_training_pipeline: false
  overlap_env_bootstrap: false
  weight_sync_interval: 1
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  dsrl_reward_semantics: discounted_alive_masked_v1
  dsrl_observation_semantics: main_wrist_shared_encoder_concat_v1
  dsrl_replay_semantics: trajectory_buffer
  dsrl_transition_boundary_semantics: terminal_observation_first_done_default_reset_v1
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 16
    sample_window_size: 16
    min_buffer_size: 1
    auto_save: false
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 8
    max_steps_per_rollout_epoch: 20
    max_episode_steps: 20
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/train
      image_keys:
      - main_images
      - wrist_images
      image_names:
      - agentview
      - eye_in_hand
      composite_views:
      - agentview
      - eye_in_hand
      composite_name: combined
    init_params:
      extension_path: /data/home/chenxiangyu/Tabero/Tabero_X/source/tac_manip
      realworld_config_dir: /data/home/chenxiangyu/Tabero/Tabero_X/benchmarks/datasets/realworld/config
      realworld_assets_dir: /data/home/chenxiangyu/Tabero/Tabero_X/benchmarks/datasets/realworld/USD
      gripper_diagnostics_path: ''
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
  eval:
    rollout_epoch: 1
    total_num_envs: 8
    max_steps_per_rollout_epoch: 20
    max_episode_steps: 20
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval
      image_keys:
      - main_images
      - wrist_images
      image_names:
      - agentview
      - eye_in_hand
      composite_views:
      - agentview
      - eye_in_hand
      composite_name: combined
    init_params:
      extension_path: /data/home/chenxiangyu/Tabero/Tabero_X/source/tac_manip
      realworld_config_dir: /data/home/chenxiangyu/Tabero/Tabero_X/benchmarks/datasets/realworld/config
      realworld_assets_dir: /data/home/chenxiangyu/Tabero/Tabero_X/benchmarks/datasets/realworld/USD
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
      gripper_diagnostics_path: ''
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: /data/home/chenxiangyu/Tabero/results/2026-09-05_23-36-08-task820-firm-mixed-tacfield-sft-8gpu-30k-from0/exports/global_step_18000
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 8
  seed: 42
  enable_offload: false
  combine_reference_model: true
  model:
    model_path: /data/home/chenxiangyu/Tabero/results/2026-09-05_23-36-08-task820-firm-mixed-tacfield-sft-8gpu-30k-from0/exports/global_step_18000
    model_type: openpi
    precision: null
    num_action_chunks: 10
    action_dim: 13
    is_lora: false
    use_proprio: true
    num_steps: 10
    add_value_head: false
    checkpoint_load_allowed_missing_prefixes:
    - dsrl_action_noise_net.
    - actor_image_encoder.
    - actor_state_encoder.
    - actor_tactile_encoder.
    - critic_image_encoder.
    - critic_state_encoder.
    - critic_tactile_encoder.
    - q_head.
    tabero_pi05_checkpoint_contract:
      expected_model_sha256: 8dd4af58eb66915851962555fdd6d2c3ee18b262a16703fa953a2441fb02fcad
      expected_norm_stats_sha256: ca9f865ef95d683070cd1abb03fdfe8b8fcddb3a9ad7392fc3501db2f3d1f863
      expected_config_name: pi05_lora_tacfield_realworld_replayed_task820
      expected_norm_asset_id: pi05_horizon50_tacfield_task820_firm_mixed
      expected_dataset: datasets/realworld_replay_task820_firm_mixed
      expected_gripper_coordinate: xarm_positive_open
      require_final: false
      allow_non_final_formal_training: true
    openpi:
      config_name: pi05_lora_tacfield_realworld_replayed_task820
      pi05: true
      action_horizon: 50
      discrete_state_input: true
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: 10
      num_steps: 10
      train_expert_only: true
      action_env_dim: 13
      effective_action_dim: 13
      noise_method: flow_sde
      add_value_head: false
      joint_logprob: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: true
      tactile_type: expert_his_c_fut
      tactile_dim: 6
      tactile_dim_in: 0
      tactile_prefix_dim_in: 7920
      tactile_prefix_history: 8
      tactile_prefix_encoder_type: tcn
      tactile_prefix_use_reference_frame: true
      tactile_prefix_diff_from_reference: false
      tactile_streams:
      - tactile_prefix
      tactile_loss_weight: 0.01
      use_dsrl: true
      dsrl_use_tactile: true
      dsrl_tactile_input_dim: 880
      dsrl_num_images: 2
      dsrl_state_dim: 7
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_tactile_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
    add_q_head: true
    q_head_type: default
    num_q_heads: 10
    gradient_checkpointing: false
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
    weight_decay: 0.0
    lr_scheduler: torch_constant
  critic_optim:
    lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 10.0
    lr_scheduler: torch_constant
    weight_decay: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
    checkpoint_format: local_shard
    save_full_model_weights: false
    save_trainable_model_weights: true
    trainable_checkpoint_metadata:
      method: dsrl
      target_global_step: 2
      training_config: isaaclab_pi05_dsrl_task820_tacfield_8gpu_smoke
reward:
  use_reward_model: false
critic:
  use_critic_model: false
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
defaults:
- env/isaaclab_xarm_umi_gentle_grasp_task6@env.train
- env/isaaclab_xarm_umi_gentle_grasp_task6@env.eval
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
