defaults:
  - env/isaaclab_xarm_umi_gentle_grasp_task6@env.train
  - env/isaaclab_xarm_umi_gentle_grasp_task6@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor:
      node_group: train
      placement: 0
    rollout:
      node_group: train
      placement: 2
    env:
      node_group: sim
      placement: 3
  node_groups:
    - label: train
      node_ranks: 0
      env_configs:
        - node_ranks: 0
          python_interpreter_path: ${oc.env:ROOT}/RLinf/.venv/bin/python
    - label: sim
      node_ranks: 0
      env_configs:
        - node_ranks: 0
          python_interpreter_path: ${oc.env:ROOT}/IsaacLab/.venv/bin/python
          env_vars:
            - ISAACSIM_PATH: ${oc.env:ROOT}/isaacsim
            - ISAACSIM_PYTHON_EXE: ${oc.env:ROOT}/isaacsim/python.sh
            - ISAACLAB_PATH: ${oc.env:ROOT}/IsaacLab
            - ISAAC_PATH: ${oc.env:ROOT}/isaacsim
            - EXP_PATH: ${oc.env:ROOT}/isaacsim/apps
            - CARB_APP_PATH: ${oc.env:ROOT}/isaacsim/kit
            - OMNI_KIT_ACCEPT_EULA: "YES"
            - PYTHONPATH: ${oc.env:ROOT}/RLinf:${oc.env:ROOT}/isaacsim/python_packages:${oc.env:ROOT}/isaacsim/exts/isaacsim.simulation_app:${oc.env:ROOT}/isaacsim/extsDeprecated/omni.isaac.kit:${oc.env:ROOT}/isaacsim/kit/kernel/py:${oc.env:ROOT}/isaacsim/kit/plugins/bindings-python:${oc.env:ROOT}/isaacsim/exts/isaacsim.robot_motion.lula/pip_prebundle:${oc.env:ROOT}/isaacsim/exts/isaacsim.asset.exporter.urdf/pip_prebundle:${oc.env:ROOT}/isaacsim/extscache/omni.kit.pip_archive-0.0.0+69cbf6ad.lx64.cp311/pip_prebundle:${oc.env:ROOT}/isaacsim/exts/omni.isaac.core_archive/pip_prebundle:${oc.env:ROOT}/isaacsim/exts/omni.isaac.ml_archive/pip_prebundle:${oc.env:ROOT}/isaacsim/exts/omni.pip.compute/pip_prebundle:${oc.env:ROOT}/isaacsim/exts/omni.pip.cloud/pip_prebundle
            - LD_LIBRARY_PATH: ${oc.env:ROOT}/isaacsim:${oc.env:ROOT}/isaacsim/exts/isaacsim.robot.schema/plugins/lib:${oc.env:ROOT}/isaacsim/exts/isaacsim.robot_motion.lula/pip_prebundle:${oc.env:ROOT}/isaacsim/exts/isaacsim.asset.exporter.urdf/pip_prebundle:${oc.env:ROOT}/isaacsim/kit:${oc.env:ROOT}/isaacsim/kit/kernel/plugins:${oc.env:ROOT}/isaacsim/kit/libs/iray:${oc.env:ROOT}/isaacsim/kit/plugins:${oc.env:ROOT}/isaacsim/kit/plugins/bindings-python:${oc.env:ROOT}/isaacsim/kit/plugins/carb_gfx:${oc.env:ROOT}/isaacsim/kit/plugins/rtx:${oc.env:ROOT}/isaacsim/kit/plugins/gpu.foundation

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:ROOT}/results
    project_name: tabero-rlinf
    experiment_name: ${oc.env:REALWORLD_TABERO_TACIMG_PIRL_RUN_ID}
    logger_backends: [tensorboard, wandb]
  max_epochs: 1
  max_steps: 1
  only_eval: false
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  tabero_ppo_transition_boundary_semantics: realworld_terminal_prefix
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.05
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/train
      image_keys: [main_images, wrist_images]
      image_names: [agentview, eye_in_hand]
      composite_views: [agentview, eye_in_hand]
      composite_name: combined
    init_params:
      extension_path: ${oc.env:ROOT}/Tabero_X/source/tac_manip
      realworld_config_dir: ${oc.env:ROOT}/Tabero_X/benchmarks/datasets/realworld/config
      realworld_assets_dir: ${oc.env:ROOT}/Tabero_X/benchmarks/datasets/realworld/USD
      gripper_diagnostics_path: ${runner.logger.log_path}/${runner.logger.experiment_name}/gripper_diagnostics.jsonl
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval
      image_keys: [main_images, wrist_images]
      image_names: [agentview, eye_in_hand]
      composite_views: [agentview, eye_in_hand]
      composite_name: combined
    init_params:
      extension_path: ${oc.env:ROOT}/Tabero_X/source/tac_manip
      realworld_config_dir: ${oc.env:ROOT}/Tabero_X/benchmarks/datasets/realworld/config
      realworld_assets_dir: ${oc.env:ROOT}/Tabero_X/benchmarks/datasets/realworld/USD
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:ROOT}/models/pi05_realworld_replayed_task820_23000_lora
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 42
  enable_offload: false
  combine_reference_model: true
  model:
    deployment_config_name: pi05_lora_tacimg_realworld_replayed_task820_force
    export_norm_asset_id: pi05_horizon50_tacimg_task820_firm
    model_path: ${oc.env:ROOT}/models/pi05_realworld_replayed_task820_23000_lora
    model_type: openpi
    precision: null
    frozen_parameter_precision: bf16
    trainable_parameter_precision: fp32
    num_action_chunks: 10
    action_dim: 13
    is_lora: true
    lora_rank: 32
    action_expert_lora_rank: 32
    lora_path: null
    lora_target: action_expert
    freeze_non_lora: true
    use_proprio: true
    num_steps: 10
    add_value_head: true
    checkpoint_load_allowed_missing_prefixes: [value_head.]
    openpi:
      config_name: pi05_lora_tacimg_realworld_replayed_task820_force
      pi05: true
      action_horizon: 50
      discrete_state_input: true
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 10
      num_steps: 10
      train_expert_only: true
      action_env_dim: 13
      effective_action_dim: 13
      noise_method: flow_sde
      add_value_head: true
      joint_logprob: false
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      tactile_type: expert_his_c_fut
      tactile_dim: 6
      tactile_dim_in: 0
      tactile_prefix_dim_in: null
      tactile_prefix_history: null
      tactile_prefix_encoder_type: null
      tactile_prefix_use_reference_frame: null
      tactile_prefix_diff_from_reference: null
      tactile_streams: []
      tactile_loss_weight: 0.001
      use_dsrl: false
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: bf16
    grad_scaler:
      enabled: false
    checkpoint_format: dcp
    save_full_model_weights: false
    save_trainable_model_weights: true
reward:
  use_reward_model: false

critic:
  use_critic_model: false
