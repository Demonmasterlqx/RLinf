defaults:
  - env/isaaclab_xarm_umi_gentle_grasp_task6@env.train
  - env/isaaclab_xarm_umi_gentle_grasp_task6@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor:
      node_group: train
      placement: 0
    rollout:
      node_group: train
      placement: 2
    env:
      node_group: sim
      placement: 3
  node_groups:
    - label: train
      node_ranks: 0
      env_configs:
        - node_ranks: 0
          python_interpreter_path: /home_shared/rashare/qixuan/Tabero/RLinf/.venv/bin/python
    - label: sim
      node_ranks: 0
      env_configs:
        - node_ranks: 0
          python_interpreter_path: /home_shared/rashare/qixuan/Tabero/.tabero_env/bin/python
          env_vars:
            - ISAACSIM_PATH: /home_shared/rashare/qixuan/Tabero/isaac-sim
            - ISAACSIM_PYTHON_EXE: /home_shared/rashare/qixuan/Tabero/isaac-sim/python.sh
            - ISAACLAB_PATH: /home_shared/rashare/qixuan/Tabero/IsaacLab
            - ISAAC_PATH: /home_shared/rashare/qixuan/Tabero/isaac-sim
            - EXP_PATH: /home_shared/rashare/qixuan/Tabero/isaac-sim/apps
            - CARB_APP_PATH: /home_shared/rashare/qixuan/Tabero/isaac-sim/kit
            - OMNI_KIT_ACCEPT_EULA: "YES"
            - PYTHONPATH: /home_shared/rashare/qixuan/Tabero/RLinf:/home_shared/rashare/qixuan/Tabero/isaac-sim/python_packages:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/isaacsim.simulation_app:/home_shared/rashare/qixuan/Tabero/isaac-sim/extsDeprecated/omni.isaac.kit:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/kernel/py:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/plugins/bindings-python:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/isaacsim.robot_motion.lula/pip_prebundle:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/isaacsim.asset.exporter.urdf/pip_prebundle:/home_shared/rashare/qixuan/Tabero/isaac-sim/extscache/omni.kit.pip_archive-0.0.0+69cbf6ad.lx64.cp311/pip_prebundle:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/omni.isaac.core_archive/pip_prebundle:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/omni.isaac.ml_archive/pip_prebundle:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/omni.pip.compute/pip_prebundle:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/omni.pip.cloud/pip_prebundle
            - LD_LIBRARY_PATH: /home_shared/rashare/qixuan/Tabero/isaac-sim:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/isaacsim.robot.schema/plugins/lib:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/isaacsim.robot_motion.lula/pip_prebundle:/home_shared/rashare/qixuan/Tabero/isaac-sim/exts/isaacsim.asset.exporter.urdf/pip_prebundle:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/kernel/plugins:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/libs/iray:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/plugins:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/plugins/bindings-python:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/plugins/carb_gfx:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/plugins/rtx:/home_shared/rashare/qixuan/Tabero/isaac-sim/kit/plugins/gpu.foundation

runner:
  task_type: embodied
  logger:
    log_path: /home_shared/rashare/qixuan/Tabero/results
    project_name: tabero-rlinf
    experiment_name: ${oc.env:REALWORLD_TABERO_TACIMG_PIRL_RUN_ID}
    logger_backends: [tensorboard, wandb]
  max_epochs: 1
  max_steps: 1
  only_eval: false
  val_check_interval: -1
  save_interval: 1
  resume_dir: null
  ckpt_path: null

algorithm:
  tabero_ppo_transition_boundary_semantics: terminal_observation_first_done_prefix_logprob_default_reset_gripper_map_v2
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.05
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/train
      image_keys: [main_images, wrist_images]
      image_names: [agentview, eye_in_hand]
      composite_views: [agentview, eye_in_hand]
      composite_name: combined
    init_params:
      extension_path: /home_shared/rashare/qixuan/Tabero/Tabero_X/source/tac_manip
      realworld_config_dir: /home_shared/rashare/qixuan/Tabero/Tabero_X/benchmarks/datasets/realworld/config
      realworld_assets_dir: /home_shared/rashare/qixuan/Tabero/Tabero_X/benchmarks/datasets/realworld/USD
      gripper_diagnostics_path: ${runner.logger.log_path}/${runner.logger.experiment_name}/gripper_diagnostics.jsonl
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval
      image_keys: [main_images, wrist_images]
      image_names: [agentview, eye_in_hand]
      composite_views: [agentview, eye_in_hand]
      composite_name: combined
    init_params:
      extension_path: /home_shared/rashare/qixuan/Tabero/Tabero_X/source/tac_manip
      realworld_config_dir: /home_shared/rashare/qixuan/Tabero/Tabero_X/benchmarks/datasets/realworld/config
      realworld_assets_dir: /home_shared/rashare/qixuan/Tabero/Tabero_X/benchmarks/datasets/realworld/USD
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0

rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: /home_shared/rashare/qixuan/Tabero/models/pi05_realworld_replayed_task820_23000_lora
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 1
  seed: 42
  enable_offload: false
  combine_reference_model: true
  model:
    model_path: /home_shared/rashare/qixuan/Tabero/models/pi05_realworld_replayed_task820_23000_lora
    model_type: openpi
    precision: null
    frozen_parameter_precision: bf16
    trainable_parameter_precision: fp32
    num_action_chunks: 10
    action_dim: 13
    is_lora: true
    lora_rank: 32
    action_expert_lora_rank: 32
    lora_path: null
    lora_target: action_expert
    freeze_non_lora: true
    use_proprio: true
    num_steps: 10
    add_value_head: true
    checkpoint_load_allowed_missing_prefixes: [value_head.]
    tabero_pi05_checkpoint_contract:
      expected_model_sha256: 9b506e72d643fb2df78f8aa1fd0f730d52df10566d247f6f2ea4a5010f1e6c15
      expected_norm_stats_sha256: 6b8751c3699f3a00a7c4a0335ab20bf629e2c63cfebb9c43b8473fd60490d88b
      expected_config_name: pi05_lora_tacimg_realworld_replayed_task820_force
      expected_norm_asset_id: pi05_horizon50_tacimg_task820_firm
      expected_dataset: datas/realworld_replayed_task820_firm
      expected_gripper_coordinate: xarm_positive_open
      require_final: false
    openpi:
      config_name: pi05_lora_tacimg_realworld_replayed_task820_force
      pi05: true
      action_horizon: 50
      discrete_state_input: true
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 10
      num_steps: 10
      train_expert_only: true
      action_env_dim: 13
      effective_action_dim: 13
      noise_method: flow_sde
      add_value_head: true
      joint_logprob: false
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      tactile_type: expert_his_c_fut
      tactile_dim: 6
      tactile_dim_in: 0
      tactile_prefix_dim_in: null
      tactile_prefix_history: null
      tactile_prefix_encoder_type: null
      tactile_prefix_use_reference_frame: null
      tactile_prefix_diff_from_reference: null
      tactile_streams: []
      tactile_loss_weight: 0.001
      use_dsrl: false
  optim:
    lr: 1.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: bf16
    grad_scaler:
      enabled: false
    checkpoint_format: dcp
    save_full_model_weights: false
    save_trainable_model_weights: true
    trainable_checkpoint_metadata:
      method: pirl
      task_domain: realworld
      task_suite: gentle_grasp
      task_id: 6
      success_scene_task_id: 6
      semantic_task_ids: [0, 2, 4]
      target_object: target_object_1
      task_description: "pick up the Vitasoy and put it into the basket"
      control_mode: hybrid_tactile
      reset_source: task_config_default_reset
      gripper_coordinate: xarm_positive_open
      action_filter: disabled
      gripper_mapping: xarm_unit_inverse_v1
      policy_gripper_coordinate: unit_0_closed_1_open
      sim_gripper_coordinate: meters_0_open_0045_close
      gripper_travel_m: 0.045
      camera_preprocess: stretch_480x640_to_224x224_inter_area
      model_family: pi05
      openpi_config_name: pi05_lora_tacimg_realworld_replayed_task820_force
      dataset: datas/realworld_replayed_task820_firm
      normalization_asset_id: pi05_horizon50_tacimg_task820_firm
      base_model_sha256: ${actor.model.tabero_pi05_checkpoint_contract.expected_model_sha256}
      base_norm_stats_sha256: ${actor.model.tabero_pi05_checkpoint_contract.expected_norm_stats_sha256}
      base_checkpoint_require_final: false
      action_horizon: 50
      execution_horizon: 10
      effective_action_dim: 13
      state_dim: 7
      camera_count: 3
      tactile_input: tactile_image
      tactile_image_history: 8
      tactile_mosaic_layout: left_2x4_then_right_2x4
      excluded_tactile_inputs: [tactile_gripper_force, tactile_marker_motion]
      reward_contract: binary_success_plus_inverse_measured_force_v1
      force_reward_source: policy_gripper_net_force
      training_config: isaaclab_pi05_pirl_realworld_tabero_tacimg_task6_step23000_fixed_gripper_shared_sim_smoke
      target_global_step: 1
      gradient_checkpointing: true
      gradient_checkpointing_use_reentrant: false
      tabero_ppo_transition_boundary_semantics: terminal_observation_first_done_prefix_logprob_default_reset_gripper_map_v2

reward:
  use_reward_model: false

critic:
  use_critic_model: false
