hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(message)s"
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers: [console]
    disable_existing_loggers: false

cluster:
  num_nodes: 1
  component_placement:
    actor: 4-7
    rollout: 0-3
    env: 0-3
runner:
  task_type: embodied
  logger:
    log_path: "/data/home/sim6g/code/tabero/results/tabero_firm_matrix_dsrl_task5_formal_${oc.env:TABERO_MATRIX_RUN_ID}"
    project_name: tabero-rlinf
    experiment_name: "tabero_firm_matrix_dsrl_task5_formal_${oc.env:TABERO_MATRIX_RUN_ID}"
    logger_backends:
    - tensorboard
    - wandb
  max_epochs: 50
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 200
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 1024
    sample_window_size: 1024
    min_buffer_size: 10
    auto_save: false
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  enable_offload: false
  train:
    env_type: isaaclab
    rollout_epoch: 2
    total_num_envs: 84
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: false
    use_step_penalty: false
    seed: 42
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 360
    max_episode_steps: 360
    video_cfg:
      save_video: false
      info_on_video: true
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/train
    init_params:
      id: Isaac-Libero-Franka-Hybrid-Tactile-v0
      num_envs: null
      max_episode_steps: 360
      task_description: pick up the tomato sauce and place it in the basket
      extension_path: /data/home/sim6g/code/tabero/Tabero/source/tac_manip
      libero_config_dir: /data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/config
      libero_assets_dir: /data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/USD
      hdf5_initial_states_path: /data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/assembled_hdf5/libero_object_task5_pick_up_the_tomato_sauce_and_place_it_in_the_basket_demo.hdf5
      hdf5_reset_assignment: cyclic
      task_suite: libero_object
      task_id: 5
      tasks:
      - task_suite: libero_object
        task_id: 5
      require_all_tasks_active: true
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        condition_reward_multipliers: null
      prompt_conditions:
        enabled: true
        assignment: cyclic
        condition_cycle:
        - firm
        firm_adverbs:
        - firmly
        - tightly
        gentle_adverbs:
        - gently
        - softly
        prompt_seed: 0
      use_relative_mode: false
      marker_history_len: 8
      combined_marker_count: 198
      main_image_key: agentview_rgb
      wrist_image_key: eye_in_hand_rgb
      marker_motion_key: gripper_marker_motion
      force_key: null
      agentview_cam:
        height: 256
        width: 256
      eye_in_hand_cam:
        height: 256
        width: 256
  eval:
    env_type: isaaclab
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: true
    ignore_terminations: true
    use_rel_reward: false
    use_step_penalty: false
    seed: 42
    group_size: 1
    reward_coef: 1.0
    use_fixed_reset_state_ids: true
    max_steps_per_rollout_epoch: 360
    max_episode_steps: 360
    video_cfg:
      save_video: false
      info_on_video: true
      fps: 20
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: Isaac-Libero-Franka-Hybrid-Tactile-v0
      num_envs: null
      max_episode_steps: 360
      task_description: pick up the tomato sauce and place it in the basket
      extension_path: /data/home/sim6g/code/tabero/Tabero/source/tac_manip
      libero_config_dir: /data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/config
      libero_assets_dir: /data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/USD
      hdf5_initial_states_path: /data/home/sim6g/code/tabero/Tabero/benchmarks/datasets/libero/assembled_hdf5/libero_object_task5_pick_up_the_tomato_sauce_and_place_it_in_the_basket_demo.hdf5
      hdf5_reset_assignment: cyclic
      task_suite: libero_object
      task_id: 5
      tasks:
      - task_suite: libero_object
        task_id: 5
      require_all_tasks_active: true
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        condition_reward_multipliers: null
      prompt_conditions:
        enabled: true
        assignment: cyclic
        condition_cycle:
        - firm
        firm_adverbs:
        - firmly
        - tightly
        gentle_adverbs:
        - gently
        - softly
        prompt_seed: 0
      use_relative_mode: false
      marker_history_len: 8
      combined_marker_count: 198
      main_image_key: agentview_rgb
      wrist_image_key: eye_in_hand_rgb
      marker_motion_key: gripper_marker_motion
      force_key: null
      agentview_cam:
        height: 256
        width: 256
      eye_in_hand_cam:
        height: 256
        width: 256
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: /data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors
    precision: null
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 168
  seed: 42
  enable_offload: false
  combine_reference_model: true
  rollout_sync_prefixes:
  - dsrl_action_noise_net.
  - actor_image_encoder.
  - actor_state_encoder.
  - actor_tactile_encoder.
  model:
    model_path: /data/home/sim6g/code/tabero/models/pi0_lora_tacfield_tabero_safetensors
    model_type: openpi
    precision: null
    num_action_chunks: 10
    action_dim: 13
    is_lora: false
    use_proprio: true
    num_steps: 10
    add_value_head: false
    add_q_head: true
    q_head_type: default
    num_q_heads: 10
    openpi:
      config_name: pi0_lora_tacfield_tabero
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: 10
      num_steps: 10
      train_expert_only: true
      action_env_dim: 13
      noise_method: flow_sde
      add_value_head: false
      joint_logprob: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: true
      tactile_loss_weight: 0.0
      use_dsrl: true
      dsrl_use_tactile: true
      dsrl_state_dim: 7
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_tactile_latent_dim: 64
      dsrl_hidden_dims:
      - 128
      - 128
      - 128
  optim:
    lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-08
    clip_grad: 3.5
    weight_decay: 0.0
  critic_optim:
    lr: 0.0003
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 10.0
    lr_scheduler: torch_constant
    weight_decay: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    checkpoint_format: local_shard
    save_full_model_weights: false
    save_trainable_model_weights: true
    trainable_checkpoint_metadata:
      method: dsrl
      task_id: 5
      training_config: isaaclab_pi0_dsrl_tacfield_tabero_task5_firm_8gpu_50step
      target_global_step: 50
reward:
  use_reward_model: false
critic:
  use_critic_model: false
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
