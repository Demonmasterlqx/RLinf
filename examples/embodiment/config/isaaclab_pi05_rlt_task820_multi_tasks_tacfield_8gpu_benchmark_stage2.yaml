# Synchronous RLT RL Stage 2: continue the MLP actor/twin-Q heads from RL
# Stage 1 on the frozen SFT/RLT encoder and Pi05 reference policy.
# Three tasks share 6 logical env shards: 192 training environments, 64 per task.
# The Stage 1 Hub bundle supplies rlt_encoder.safetensors; the base Pi05 model
# remains in models/VTLA-RL-sft-lora-franka-no-adverb-05-effort/step_30000.
# Launch with train_embodied_agent.py after Stage 1 has produced global_step_200.
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    env: 0-5
    rollout: 0-7
    actor: 0-7
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:ROOT}/results
    project_name: tabero-rlinf
    experiment_name: task820_multi_tasks_rlt_tacfield_8gpu
    logger_backends:
    - tensorboard
    - wandb
    wandb_entity: 183842220-hkust
  # RL Stage 1: 0-200, Stage 2: 200-400, Stage 3: 400-800.
  max_epochs: 400
  max_steps: 400
  only_eval: false
  val_check_interval: -1
  save_interval: 10
  resume_dir: ${oc.env:ROOT}/results/task820_multi_tasks_rlt_tacfield_8gpu/checkpoints/global_step_200
  ckpt_path: null
  use_training_pipeline: false
  overlap_env_bootstrap: false
  weight_sync_interval: 1
  per_worker_log: false
algorithm:
  # RLT uses transition replay and the BC-regularized twin-Q objective.
  rlt_schedule:
    enable: true
    transition_replay: true
    max_updates_per_train_step: 500
    warmup_min_size: 256
    warmup_post_collect_updates: 2000
    train_every_episodes: 0
    train_every_transitions: 32
  rlt_route:
    actor_scope: full_task
  group_size: 1
  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: token-mean
  agg_q: min
  actor_agg_q: q1
  enable_drq: false
  q_head_type: ${actor.model.q_head_type}
  bootstrap_type: standard
  gamma: 0.995
  tau: 0.005
  q_weight: 0.45
  bc_weight: 2.5
  reference_dropout_prob: 0.0
  actor_weight_schedule:
    enable: true
    warmup_updates: 2000
    ramp_updates: 5000
    warmup_bc_weight: 7.0
    warmup_q_weight: 0.05
    online_bc_weight: 2.5
    online_q_weight: 0.45
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 0.0003
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    cache_size: 10000
    sample_window_size: 100000
    max_num_samples: 100000
    min_buffer_size: 1
    auto_save: true
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1000
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: false
  multi_task:
    enabled: true
    ema_decay: 0.9
    weight_min: 0.5
    weight_max: 2.0
    sigmoid_scale: 10.0
env:
  group_name: EnvGroup
  train:
    multi_task:
      tasks:
      - name: vitasoy
        init_params:
          target_object: target_object_1
          task_description: pick up the Vitasoy and put it into the basket
          success:
            normalize_effort_reward:
              min_effort: 2.0
              mid_effort: 36.0
      - name: coca_cola
        init_params:
          target_object: target_object_2
          task_description: Pick up the Coca-Cola and put it into the basket
          success:
            normalize_effort_reward:
              min_effort: 4.0
              mid_effort: 12.0
      - name: cookie
        init_params:
          target_object: target_object_3
          task_description: pick up the cookie and put it into the basket
          success:
            normalize_effort_reward:
              min_effort: 3.0
              mid_effort: 30.0
    rollout_epoch: 1
    total_num_envs: 192
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/train
      image_keys:
      - main_images
      - wrist_images
      image_names:
      - agentview
      - eye_in_hand
      composite_views:
      - agentview
      - eye_in_hand
      composite_name: combined
    init_params:
      extension_path: ${oc.env:ROOT}/Tabero_X/source/tac_manip
      realworld_config_dir: ${oc.env:ROOT}/Tabero_X/benchmarks/datasets/realworld/config/gentle_grasp_0.5_griper_pos_random_delta_500g_stage_1_3_+-2cm/stage2
      realworld_assets_dir: ${oc.env:ROOT}/Tabero_X/benchmarks/datasets/realworld/USD
      gripper_diagnostics_path: ''
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: false
          coefficient: 10.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
        normalize_effort_reward:
          enabled: false
          coefficient: 10.0
          min_effort: 0.0
          mid_effort: 100.0
          min_valid_samples: 4
          contact_epsilon: 1.0
  eval:
    multi_task: ${env.train.multi_task}
    rollout_epoch: 1
    total_num_envs: 96
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval
      image_keys:
      - main_images
      - wrist_images
      image_names:
      - agentview
      - eye_in_hand
      composite_views:
      - agentview
      - eye_in_hand
      composite_name: combined
    init_params:
      extension_path: ${oc.env:ROOT}/Tabero_X/source/tac_manip
      realworld_config_dir: ${env.train.init_params.realworld_config_dir}
      realworld_assets_dir: ${oc.env:ROOT}/Tabero_X/benchmarks/datasets/realworld/USD
      tactile_image_history_len: 8
      success: ${env.train.init_params.success}
rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: true
  model:
    model_type: ${actor.model.model_type}
    model_path: ""
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    fixed_std: ${actor.model.fixed_std}
    normalized_action_bound: ${actor.model.normalized_action_bound}
  rlt_feature_model:
    model_type: openpi
    # The base Pi05 checkpoint supplies the VLA/tactile backbone. The
    # downloaded Stage 1 encoder is injected from rlt_encoder_path below.
    model_path: ${oc.env:ROOT}/models/VTLA-RL-sft-lora-franka-no-adverb-05-effort/step_30000
    rlt_encoder_path: ${oc.env:ROOT}/models/VTLA-RL-sft-lora-franka-no-adverb-05-effort-rlt-stage1/rlt_encoder.safetensors
    precision: null
    num_action_chunks: 10
    action_dim: 13
    is_lora: false
    checkpoint_load_allowed_missing_prefixes:
    - rlt_module.decoder.
    openpi_data:
      norm_stats_path: ${oc.env:ROOT}/models/VTLA-RL-sft-lora-franka-no-adverb-05-effort/step_30000/pi05_horizon50_tacfield_task820_firm_mixed/norm_stats.json
    openpi:
      config_name: pi05_lora_tacfield_realworld_replayed_task820_firm_mixed_no_state
      pi05: true
      action_horizon: 50
      discrete_state_input: false
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: 10
      num_steps: 10
      train_expert_only: true
      action_env_dim: 13
      effective_action_dim: 13
      noise_method: flow_sde
      add_value_head: false
      joint_logprob: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      tactile_type: expert_his_c_fut
      tactile_dim: 6
      tactile_dim_in: 0
      tactile_prefix_dim_in: 7920
      tactile_prefix_history: 8
      tactile_prefix_encoder_type: tcn
      tactile_prefix_use_reference_frame: true
      tactile_prefix_diff_from_reference: false
      tactile_streams:
      - tactile_prefix
      tactile_loss_weight: 0.01
      use_rlt: true
      rlt_train_module_only: false
      rlt_stage2_encoder_only: true
      rlt_action_space: model_normalized
      rlt_use_normalized_proprio: true
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_num_rl_tokens: 1
      rlt_prefix_seq_len: 1024
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: false
      rlt_use_mask: true
  enable_torch_compile: false
  enable_cuda_graph: false
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 48
  global_batch_size: 384
  seed: 42
  enable_offload: false
  model:
    model_type: rlt_mlp_policy
    model_path: ""
    precision: fp32
    policy_setup: task820-tacfield-rlt
    action_dim: 13
    num_action_chunks: 10
    ref_num_action_chunks: 10
    z_dim: 2048
    proprio_dim: 7
    add_value_head: false
    add_q_head: true
    q_head_type: default
    fixed_std: 0.05
    normalized_action_bound: 4.0
    is_lora: false
  optim:
    clip_grad: 3.5
    lr: 0.0001
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 0.0003
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    cpu_offload: false
    save_trainable_model_weights: true
    checkpoint_format: dcp
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    trainable_checkpoint_metadata:
      method: rlt_stage2
      stage1_encoder_bundle: models/VTLA-RL-sft-lora-franka-no-adverb-05-effort-rlt-stage1
      base_model: models/VTLA-RL-sft-lora-franka-no-adverb-05-effort/step_30000
      target_global_step: 400
      training_config: isaaclab_pi05_rlt_task820_multi_tasks_tacfield_8gpu_benchmark_stage2
      action_space: model_normalized
      z_dim: 2048
      proprio_dim: 7
      action_dim: 13
      num_action_chunks: 10
  sync_weight_no_wait: true
reward:
  use_reward_model: false
critic:
  use_critic_model: false
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
defaults:
- env/isaaclab_xarm_umi_gentle_grasp_task6@env.train
- env/isaaclab_xarm_umi_gentle_grasp_task6@env.eval
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
