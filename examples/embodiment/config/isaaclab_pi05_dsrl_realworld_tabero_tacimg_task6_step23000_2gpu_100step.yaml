defaults:
  - env/isaaclab_xarm_umi_gentle_grasp_task6@env.train
  - env/isaaclab_xarm_umi_gentle_grasp_task6@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: "1"
    rollout: "0"
    env: "0"

runner:
  task_type: embodied
  logger:
    log_path: /data/home/sim6g/code/tabero/results
    project_name: tabero-rlinf
    experiment_name: ${oc.env:REALWORLD_TABERO_TACIMG_DSRL_RUN_ID}
    logger_backends: [tensorboard, wandb]
  max_epochs: 100
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false

algorithm:
  normalize_advantages: false
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 200
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  agg_q: mean
  actor_agg_q: mean
  backup_entropy: false
  critic_subsample_size: 0
  critic_actor_ratio: 1
  bootstrap_type: standard
  gamma: 0.999
  dsrl_reward_semantics: discounted_alive_masked_v1
  dsrl_observation_semantics: main_wrist_tactile_shared_encoder_concat_v1
  dsrl_replay_semantics: main_wrist_tactile_bf16_64_transition_ring_v1
  dsrl_transition_boundary_semantics: terminal_observation_first_done_default_reset_v1
  tau: 0.005
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 1.0
    target_entropy: -16
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    backend: compact_dsrl_ring
    capacity_transitions: 80000
    checkpoint_shard_transitions: 4096
    max_resident_gib: 12.0
    min_buffer_size: 10
  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 10
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: EnvGroup
  enable_offload: false
  train:
    rollout_epoch: 2
    total_num_envs: 8
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    init_params:
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 300
    max_episode_steps: 300
    init_params:
      tactile_image_history_len: 8
      success:
        required_consecutive_steps: 8
        terminal_reward: 1.0
        force_bonus:
          enabled: true
          coefficient: 20.0
          epsilon: 1.0
          max_bonus: 1.0
          min_valid_samples: 4
          contact_epsilon: 1.0
    video_cfg:
      video_base_dir: ${runner.logger.log_path}/${runner.logger.experiment_name}/video/eval

rollout:
  group_name: RolloutGroup
  backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  model:
    model_path: /data/home/sim6g/code/tabero/models/pi05_realworld_replayed_task820_23000_lora
    precision: ${actor.model.precision}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  rollout_sync_prefixes:
    - dsrl_action_noise_net.
    - actor_image_encoder.
    - actor_state_encoder.
  micro_batch_size: 1
  global_batch_size: 16
  seed: 42
  enable_offload: false
  combine_reference_model: true
  model:
    model_path: /data/home/sim6g/code/tabero/models/pi05_realworld_replayed_task820_23000_lora
    model_type: openpi
    precision: null
    num_action_chunks: 10
    action_dim: 13
    is_lora: false
    use_proprio: true
    num_steps: 10
    add_value_head: false
    add_q_head: true
    q_head_type: default
    num_q_heads: 10
    checkpoint_load_allowed_missing_prefixes:
      - dsrl_action_noise_net.
      - actor_image_encoder.
      - actor_state_encoder.
      - critic_image_encoder.
      - critic_state_encoder.
      - q_head.
    tabero_pi05_checkpoint_contract:
      expected_model_sha256: 9b506e72d643fb2df78f8aa1fd0f730d52df10566d247f6f2ea4a5010f1e6c15
      expected_norm_stats_sha256: 6b8751c3699f3a00a7c4a0335ab20bf629e2c63cfebb9c43b8473fd60490d88b
      expected_config_name: pi05_lora_tacimg_realworld_replayed_task820_force
      expected_norm_asset_id: pi05_horizon50_tacimg_task820_firm
      expected_dataset: datas/realworld_replayed_task820_firm
      expected_gripper_coordinate: xarm_positive_open
      require_final: false
      allow_non_final_formal_training: true
    openpi:
      config_name: pi05_lora_tacimg_realworld_replayed_task820_force
      pi05: true
      action_horizon: 50
      discrete_state_input: true
      num_images_in_input: 3
      noise_level: 0.5
      action_chunk: 10
      num_steps: 10
      train_expert_only: true
      action_env_dim: 13
      effective_action_dim: 13
      noise_method: flow_sde
      add_value_head: false
      joint_logprob: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: true
      tactile_type: expert_his_c_fut
      tactile_dim: 6
      tactile_dim_in: 0
      tactile_prefix_dim_in: null
      tactile_prefix_history: null
      tactile_prefix_encoder_type: null
      tactile_prefix_use_reference_frame: null
      tactile_prefix_diff_from_reference: null
      tactile_streams: []
      tactile_loss_weight: 0.0
      use_dsrl: true
      dsrl_use_tactile: false
      dsrl_num_images: 3
      dsrl_state_dim: 7
      dsrl_action_noise_dim: 32
      dsrl_num_q_heads: 10
      dsrl_agg_q: mean
      dsrl_image_latent_dim: 64
      dsrl_state_latent_dim: 64
      dsrl_tactile_latent_dim: 64
      dsrl_hidden_dims: [128, 128, 128]
  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.96
    adam_eps: 1.0e-8
    clip_grad: 3.5
    weight_decay: 0.0
  critic_optim:
    lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    clip_grad: 10.0
    lr_scheduler: torch_constant
    weight_decay: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    checkpoint_format: local_shard
    save_full_model_weights: false
    save_trainable_model_weights: true
    trainable_checkpoint_metadata:
      method: dsrl
      task_domain: realworld
      task_suite: gentle_grasp
      task_id: 6
      success_scene_task_id: 6
      semantic_task_ids: [0, 2, 4]
      target_object: target_object_1
      task_description: "pick up the Vitasoy and put it into the basket"
      control_mode: hybrid_tactile
      reset_source: task_config_default_reset
      policy_gripper_sign_bridge: false
      gripper_coordinate: xarm_positive_open
      action_filter: disabled
      camera_preprocess: stretch_480x640_to_224x224_inter_area
      model_family: pi05
      openpi_config_name: pi05_lora_tacimg_realworld_replayed_task820_force
      dataset: datas/realworld_replayed_task820_firm
      normalization_asset_id: pi05_horizon50_tacimg_task820_firm
      base_model_sha256: ${actor.model.tabero_pi05_checkpoint_contract.expected_model_sha256}
      base_norm_stats_sha256: ${actor.model.tabero_pi05_checkpoint_contract.expected_norm_stats_sha256}
      base_checkpoint_require_final: false
      base_checkpoint_allow_non_final_formal_training: true
      base_checkpoint_global_step: 23000
      base_checkpoint_target_global_step: 30000
      base_checkpoint_is_final: false
      action_horizon: 50
      execution_horizon: 10
      effective_action_dim: 13
      state_dim: 7
      camera_count: 3
      tactile_input: tactile_image
      tactile_image_history: 8
      tactile_mosaic_layout: left_2x4_then_right_2x4
      excluded_tactile_inputs: [tactile_gripper_force, tactile_marker_motion]
      reward_contract: binary_success_plus_inverse_measured_force_v1
      force_reward_source: policy_gripper_net_force
      dsrl_reward_semantics: discounted_alive_masked_v1
      dsrl_observation_semantics: main_wrist_tactile_shared_encoder_concat_v1
      dsrl_replay_semantics: main_wrist_tactile_bf16_64_transition_ring_v1
      dsrl_transition_boundary_semantics: terminal_observation_first_done_default_reset_v1
      training_config: isaaclab_pi05_dsrl_realworld_tabero_tacimg_task6_step23000_2gpu_100step
      target_global_step: 100

reward:
  use_reward_model: false

critic:
  use_critic_model: false

weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
